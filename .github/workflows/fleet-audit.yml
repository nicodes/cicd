name: Fleet audit
# Do the products that vendor this repository's engineering snapshot agree
# with each other?
#
# pins.mjs makes ONE product internally consistent, and every product in the
# portfolio was individually green while five different snapshot revisions
# ran at once, the vendored tree existed in five different sizes, and the
# komizo-action pin gate sat in four incompatible states. No per-repository
# check can see that: each repository is right about itself. This is the only
# thing that looks across them.
#
# SCHEDULED, not on push. Drift is not introduced by a change to THIS
# repository -- it appears when one product moves and the others do not, which
# is a day on which nothing here happens at all.
on:
  schedule:
    # Staggered off the top of the hour, the same fleet convention deployed.yml
    # follows, to dodge GitHub's scheduled-run queue congestion.
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Fleet audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      # A PAT, not GITHUB_TOKEN. The products live in three organisations and
      # this repository's own token can read none of them. Read-only, and it
      # reads nothing but default-branch file contents.
      - name: Audit
        env:
          GH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::FLEET_READ_TOKEN is not set; the audit cannot read the other products."
            echo "::error::Create a read-only PAT with contents:read on the orgs in FLEET.json."
            exit 1
          fi
          python3 helpers/fleet-audit.py
