name: Release

# Two manual stages; see docs/releases.md. This workflow never moves a tag and
# never pushes to main.
#
# The pin rewriting and the input checking live in scripts/release.sh, not
# here. They are the parts with sharp edges, they are written down once, and a
# YAML copy of them would be a second answer to "what does a release contain"
# that drifts from the first.
#
# publish is deliberately separate from prepare, and takes the MERGED sha
# rather than the candidate's. A candidate is a proposal; what gets tagged is
# what review actually accepted, and the tree check below is what makes those
# the same thing.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: prepare (make the candidate) or publish (tag a merged one)
        required: true
        type: choice
        options: [prepare, publish]
      version:
        description: vX.Y.Z — unused, and identical across both stages
        required: true
        type: string
      sha:
        description: >
          prepare: the full current main SHA to cut from.
          publish: the full merge commit of the candidate PR.
        required: true
        type: string
      pr:
        description: publish only — the merged candidate PR number
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.stage == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare the candidate branch and print the operator PR command
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: sh scripts/release.sh prepare "$VERSION" "$SOURCE_SHA" --push

  publish:
    if: inputs.stage == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the candidate was merged here, tested, and unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MERGED_SHA: ${{ inputs.sha }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be vX.Y.Z"; exit 1; }
          [[ "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-hex commit"; exit 1; }
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::publish requires the merged candidate PR number"; exit 1; }

          # A tag is never moved. An existing one is not an error to work
          # around; it means this version already shipped.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION already exists -- tags are never moved"; exit 1
          fi

          # The PR must be a merged PR of THIS repository whose merge commit
          # is the sha being tagged. Without that, publish would tag any
          # commit somebody names.
          read -r state base merge head < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json state,baseRefName,mergeCommit,headRefName \
            -q '[.state, .baseRefName, .mergeCommit.oid, .headRefName] | @tsv')
          [ "$state" = MERGED ] || { echo "::error::PR #$PR is $state, not MERGED"; exit 1; }
          [ "$base" = main ] || { echo "::error::PR #$PR merged into $base, not main"; exit 1; }
          [ "$merge" = "$MERGED_SHA" ] || { echo "::error::PR #$PR merged as $merge, not $MERGED_SHA"; exit 1; }
          [ "$head" = "release/$VERSION" ] || { echo "::error::PR #$PR is from $head, not release/$VERSION"; exit 1; }

          # That commit must be on main, and CI must have passed on it
          # exactly -- not on its branch, not on a later commit.
          git merge-base --is-ancestor "$MERGED_SHA" origin/main ||
            { echo "::error::$MERGED_SHA is not on main"; exit 1; }
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$MERGED_SHA" --event push --limit 1 --json conclusion -q '.[0].conclusion // "none"')
          [ "$ci" = success ] || { echo "::error::CI on $MERGED_SHA is '$ci', not success"; exit 1; }

          # And it must still say what prepare generated. A change introduced
          # during merge fails closed rather than shipping unreviewed.
          source=$(git log -1 --format=%B "$MERGED_SHA" | sed -n 's/^release .*: pin helper checkouts to \([0-9a-f]\{40\}\)$/\1/p' | head -1)
          [ -n "$source" ] || { echo "::error::$MERGED_SHA is not a release candidate commit"; exit 1; }
          left=$(git grep -hoE '^[[:space:]]*ref:[[:space:]]*[0-9a-f]{40}' "$MERGED_SHA" -- .github/workflows |
            awk '{print $2}' | sort -u | grep -v "^$source$" || true)
          [ -z "$left" ] || { echo "::error::self-checkout pins in the merged tree are not $source:"; echo "$left"; exit 1; }
          echo "verified: PR #$PR merged as $MERGED_SHA, CI green, helpers pinned to $source"

      - name: Tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MERGED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git -c user.name='cicd release' -c user.email='noreply@nicodes.dev' \
            tag -a "$VERSION" "$MERGED_SHA" -m "$VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$VERSION" \
            --notes "Helper checkouts pinned. Consumers pin the commit with the version in a trailing comment; see docs/releases.md."
