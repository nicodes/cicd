name: Tool watch
# Reusable tool-watch body. The caller keeps its schedule/workflow_dispatch
# and must grant the workflow at least `contents: read` + `issues: write`: a
# called workflow can only restrict, never elevate, the caller's token, and a
# smaller grant startup_failures the whole run with zero jobs before any job
# exists (live matrix 2026-09-20: under-granted
# https://github.com/nicodes/cicd/actions/runs/35483270243 vs with the floor
# https://github.com/nicodes/cicd/actions/runs/35483270273).
on:
  workflow_call:
permissions:
  contents: read
jobs:
  watch:
    name: Tool watch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Concurrency is CALLER-owned: the caller keeps its workflow-level
    # `tool-watch` group (`cancel-in-progress: false`) and this job declares
    # none — a called job naming the caller's group queues behind the
    # still-running caller and fails with zero steps, no runner and no
    # annotation (fleet: termcade tool-watch run 35528234060).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 3
      - name: Check out the shared report helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nicodes/cicd
          ref: 644d2ade854e6d8cd8f06fe2895664162379f024 # report-failure helper with the portfolio identity widening (bump-along rule, see README)
          path: .cicd
          persist-credentials: false
          sparse-checkout: helpers/
        timeout-minutes: 3
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        timeout-minutes: 15
      - run: python3 scripts/engineering/helpers/watch-tools.py
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 12
      - name: Retain the complete update inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-updates
          path: .artifacts/tool-updates.json
          if-no-files-found: ignore
          retention-days: 30
        timeout-minutes: 5
      - if: failure()
        run: python3 .cicd/helpers/report-failure.py
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 3
