name: Vulnerability scan
# Reusable vulnerability-scan body. The caller must grant the workflow at
# least `contents: read`, `packages: read`, `deployments: read` and
# `issues: write`: a called workflow can only restrict, never elevate, the
# caller's token, and a smaller grant startup_failures the whole run with
# zero jobs before any job exists (live matrix 2026-09-20: under-granted
# https://github.com/nicodes/cicd/actions/runs/35483270307 vs with the floor
# https://github.com/nicodes/cicd/actions/runs/35483270237).
on:
  workflow_call:
    inputs:
      project:
        description: Product slug passed to the caller's vendored scan-deployed.py
        required: true
        type: string
      repository:
        description: >-
          owner/repo bound to the deployed-image scan; empty (the default)
          binds the caller's own repository. Pass the declared product
          repository only when the caller lives in a differently-named repo.
        required: false
        type: string
        default: ''
      source-scan-command:
        description: Command that scans the caller's source modules; empty skips the step
        required: false
        type: string
        default: ''
permissions:
  contents: read
  packages: read
  deployments: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      packages: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        timeout-minutes: 10
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
        timeout-minutes: 3
      - name: Scan every source module
        if: inputs.source-scan-command != ''
        timeout-minutes: 30
        run: ${{ inputs.source-scan-command }}
      - name: Scan deployed runtime images
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_DEPLOYED_REPOSITORY: ${{ inputs.repository }}
        run: python3 scripts/engineering/helpers/scan-deployed.py --project ${{ inputs.project }} --repository "$SCAN_DEPLOYED_REPOSITORY"
  report:
    name: Report failure
    needs:
      - scan
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the shared report helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nicodes/cicd
          ref: 644d2ade854e6d8cd8f06fe2895664162379f024 # report-failure helper with the portfolio identity widening (bump-along rule, see README)
          path: .cicd
          persist-credentials: false
          sparse-checkout: helpers/
        timeout-minutes: 3
      - run: python3 .cicd/helpers/report-failure.py
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 3
